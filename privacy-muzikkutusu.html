        :root {

            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;

        [data-theme="light"] {

            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent: #6366f1;

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            transition: background-color 0.5s ease, color 0.5s ease;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .glass-container {
            width: 100%;
            max-width: 900px;
            margin: 40px 20px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
            transition: all 0.5s ease;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
            margin-bottom: 30px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .wolf-svg {
            width: 55px;
            height: 55px;
            fill: var(--accent);
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        .brand-titles {
            text-align: left;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--text-main), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .app-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            width: 50px;
        }

        .theme-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .lang-select {
            appearance: none;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px 40px 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }

        .lang-select:focus { border-color: var(--accent); }
        .lang-select option { background: var(--bg-base); color: var(--text-main); }

        #policy-content {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-muted);
            animation: fadeIn 0.6s ease-out;
        }

        .article-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 35px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .article-text { margin-bottom: 20px; text-align: justify; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 25px;
            font-weight: 500;
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>

    function renderPolicy() {
        const lang = document.getElementById('langBox').value;
        const container = document.getElementById('policy-content');
        const footerContainer = document.getElementById('dynamic-footer');
        const data = policies[lang];

        // İçeriği temizle ve animasyonu sıfırla
        container.innerHTML = '';
        container.style.animation = 'none';
        container.offsetHeight; 
        container.style.animation = 'fadeIn 0.6s ease-out';
        
        // Footer temizle ve animasyonu sıfırla
        footerContainer.style.animation = 'none';
        footerContainer.offsetHeight; 
        footerContainer.style.animation = 'fadeIn 0.6s ease-out';
        
        // RTL (Sağdan Sola) diller için yön ayarı
        if (lang === 'ar' || lang === 'ur') {
            container.setAttribute('dir', 'rtl');
            container.style.textAlign = 'right';
        } else {
            container.setAttribute('dir', 'ltr');
            container.style.textAlign = 'left';
        }

        // Ana Başlık
        const mainTitle = document.createElement('h2');
        mainTitle.textContent = data.title;
        mainTitle.style.color = 'var(--text-main)';
        mainTitle.style.textAlign = 'center';
        mainTitle.style.marginBottom = '25px';
        container.appendChild(mainTitle);

        // Giriş Metni
        const intro = document.createElement('div');
        intro.className = 'article-text';
        intro.innerHTML = `<strong>${data.intro}</strong>`;
        container.appendChild(intro);

        // Maddeler
        data.articles.forEach(article => {
            const artTitle = document.createElement('div');
            artTitle.className = 'article-title';
            artTitle.textContent = article.title;
            
            const artText = document.createElement('div');
            artText.className = 'article-text';
            artText.textContent = article.text;

            container.appendChild(artTitle);
            container.appendChild(artText);
        });

        // YENİ: Footer Kısmını Seçilen Dile Göre Doldur
        footerContainer.innerHTML = data.footerText;
    }

    // Sayfa Yüklendiğinde Başlat
    window.onload = () => {
        renderPolicy();
    };

</script>
