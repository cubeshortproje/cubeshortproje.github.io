    document.addEventListener('keydown', function(e) {
        if(e.ctrlKey || e.metaKey) {
            if(e.key === 'c' || e.key === 'v' || e.key === 'x' || e.key === 'a' || e.key === 's' || e.key === 'p' || e.key === 'u') {
                e.preventDefault();

            return false;

                { title: `Pasal 1: Pengecualian Tanggung Jawab Mutlak dan Sifat Perangkat Lunak`, text: `Penggunaan aplikasi sepenuhnya di bawah risiko pribadi Pengguna. Tidak ada platform digital yang bebas dari bug. Cube Short tidak dapat dimintai pertanggungjawaban atas kerusakan perangkat lunak, hilangnya data, atau kerugian langsung maupun tidak langsung.` },

                { title: `Pasal 3: Jaringan Iklan Pihak Ketiga, Kurangnya Moderasi Konten, dan Pelepasan Hak Hukum`, text: `Konten iklan yang ditampilkan, terintegrasi dalam platform, atau ditempatkan secara dinamis ke dalam antarmuka melalui jaringan periklanan global pihak ketiga (misalnya, Google AdMob, dll.) ditarik sepenuhnya secara otomatis dari server algoritmik dari penyedia iklan masing-masing, dan konten tersebut tidak disaring, disetujui, atau disaring sebelumnya secara manual oleh Cube Short dengan cara apa pun. Cube Short, yang tidak memiliki wewenang langsung untuk campur tangan dalam proses distribusi iklan algoritmik di dalam aplikasi, tidak dapat dimintai pertanggungjawaban sebagai aksesori primer atau sekunder (baik secara langsung maupun tidak langsung) atas konten iklan visual, pendengaran, atau tekstual apa pun yang dapat disajikan tergantung pada lokasi geografis pengguna, riwayat browser, atau profil perangkat, dan yang berpotensi mengandung elemen cabul (+18), kekerasan, berorientasi dewasa, tidak pantas, atau melanggar hukum. Secara khusus mengenai kemungkinan bahwa anak di bawah umur atau anak-anak yang mengakses platform dapat terpapar pada konten yang tidak pantas tersebut (termasuk namun tidak terbatas pada iklan cabul) yang mungkin muncul secara acak berdasarkan profil pengguna atau riwayat jaringan mereka sendiri, pengawasan mutlak atas perangkat dan koneksi internet yang relevan sepenuhnya berada di bawah tanggung jawab hukum orang tua atau wali yang sah. Dengan menggunakan platform ini, Pengguna atau perwakilan hukum mereka menerima sebelumnya dan secara tidak dapat dibatalkan setiap risiko paparan terhadap konten yang tidak diinginkan yang mungkin timbul dari jaringan periklanan pihak ketiga, dan menyatakan serta berjanji bahwa mereka sepenuhnya melepaskan klaim atas kompensasi administratif, pidana, hukum, atau finansial dan hak regres yang mungkin diarahkan terhadap merek Cube Short, manajernya, pengembang perangkat lunaknya, atau afiliasinya sehubungan dengan hal ini.` },
                { title: `Pasal 4: Batasan Usia dan Pengawasan Orang Tua`, text: `Aplikasi ini dirancang untuk individu berusia 13 tahun ke atas. Orang tua dari anak di bawah usia 13 tahun bertanggung jawab penuh atas tindakan mereka. Penggunaan oleh anak-anak sangat tunduk pada pengawasan keluarga.` },
                { title: `Pasal 5: Hak Kekayaan Intelektual, Hak Cipta (Copyright), dan Larangan Menyalin`, text: `Semua kode sumber, desain antarmuka, algoritma, logo, dan hak kekayaan intelektual secara eksklusif milik Cube Short. Dilarang keras melakukan rekayasa balik (reverse engineering), menyalin, mereproduksi, meniru, atau mendistribusikan platform ini tanpa lisensi. Cube Short berhak untuk memulai segala jenis proses hukum dan pidana. © Cube Short. Semua Hak Dilindungi Undang-Undang.` },
                { title: `Pasal 6: Pelepasan Hak`, text: `Pengguna secara tidak dapat dibatalkan melepaskan hak untuk mengajukan klaim atau tuntutan hukum terhadap Cube Short karena kemungkinan pelanggaran data atau kesalahan perangkat lunak.` },
                { title: `Pasal 7: Lisensi Sumber Terbuka`, text: `Music Box dikembangkan menggunakan infrastruktur sumber terbuka gratis. Tidak ada pelanggaran hak cipta yang tersembunyi.` }

            footerText: `© 2026 Cube Short. Hak Cipta Dilindungi Undang-Undang. <br> Dokumen ini berada di bawah perlindungan hukum. Dilarang memperbanyak dan menyalin tanpa izin.`

        ar: {
            title: `شروط الاستخدام والخصوصية`,
            intro: `تم إنشاء اتفاقية الاستخدام الشاملة، وشروط الخدمة المتكاملة، وسياسة الخصوصية الموسعة، واتفاقية الإعفاء المطلق من المسؤولية ("الاتفاقية") كعقد ملزم قانونًا وغير قابل للإلغاء بين العلامة التجارية Cube Short ("Cube Short") وجميع الأشخاص الطبيعيين ("المستخدم").`,
            articles: [
                { title: `المادة 1: الإعفاء المطلق من المسؤولية وطبيعة البرمجيات`, text: `استخدام التطبيق يخضع بالكامل للمخاطرة الشخصية للمستخدم. لا توجد منصة رقمية خالية من الأخطاء (bug-free). لا يمكن تحميل Cube Short المسؤولية عن أي أعطال برمجية، أو فقدان للبيانات، أو أضرار مباشرة أو غير مباشرة.` },
                { title: `المادة 2: خصوصية البيانات، اختراقات الأمن السيبراني، وسرقة البيانات`, text: `يقر المستخدم بأن الأمان المطلق (100٪) في الفضاء الإلكتروني أمر مستحيل تقنيًا. لن تخضع Cube Short لأي التزام بالتعويض في حالة الهجمات السيبرانية أو سرقة البيانات. تقع المسؤولية بالكامل على عاتق المستخدم.` },
                { title: `المادة 3: شبكات إعلانات الطرف الثالث، عدم مراقبة المحتوى والإعفاء القانوني`, text: `يتم سحب المحتويات الإعلانية المعروضة أو المدمجة داخل المنصة عبر شبكات الإعلانات العالمية التابعة لجهات خارجية (مثل Google AdMob وما إلى ذلك) تلقائيًا من خوادم الخوارزميات الخاصة بمقدمي الإعلانات المعنيين، ولا يتم تصفية هذه المحتويات أو الموافقة عليها أو فحصها مسبقًا يدويًا بواسطة Cube Short بأي شكل من الأشكال. لا تتحمل Cube Short أي مسؤولية بصفة أصلية أو فرعية (بشكل مباشر أو غير مباشر) عن أي محتوى إعلاني مرئي أو مسموع أو نصي قد يظهر بناءً على الموقع الجغرافي للمستخدم أو سجل المتصفح أو ملف تعريف الجهاز، والذي قد يحتوي بشكل محتمل على مواد فاحشة (+18) أو عنيفة أو مخصصة للبالغين أو مسيئة أو غير قانونية. وبشكل خاص، نظرًا لاحتمالية تعرض القاصرين أو الأطفال الذين يصلون إلى المنصة لمثل هذه المحتويات المسيئة (بما في ذلك على سبيل المثال لا الحصر الإعلانات الفاحشة) التي قد تظهر عشوائيًا بناءً على ملفات تعريف المستخدمين الخاصة بهم أو سجلات الشبكة، فإن المراقبة المطلقة للجهاز المعني والاتصال بالإنترنت تقع حصريًا ضمن المسؤولية القانونية للولي أو الوصي. بمجرد استخدام هذه المنصة، يقبل المستخدم أو ممثله القانوني مسبقًا وبشكل لا رجعة فيه أي خطر للتعرض لأي محتوى غير مرغوب فيه قد ينشأ عن شبكات إعلانات الطرف الثالث، ويعلن ويتعهد بالتنازل التام عن أي طلب للتعويض الإداري أو الجنائي أو القانوني أو المالي وعن حق الرجوع الذي قد يوجه ضد علامة Cube Short التجارية أو مديريها أو مبرمجيها أو الشركات التابعة لها في هذا الصدد.` },
                { title: `المادة 4: القيود العمرية والرقابة الأبوية`, text: `التطبيق مصمم للأفراد الذين تبلغ أعمارهم 13 عامًا فأكثر. آباء أي قاصر أقل من 13 عامًا مسؤولون بشكل مباشر عن أفعالهم. يخضع استخدام الأطفال للتطبيق للرقابة المطلقة للأسرة.` },
                { title: `المادة 5: حقوق الملكية الفكرية، حقوق النشر (Copyright)، وحظر النسخ`, text: `جميع الأكواد المصدرية، وتصميمات الواجهة، والخوارزميات، والشعارات، وحقوق الملكية الفكرية تعود ملكيتها حصريًا إلى Cube Short. يُحظر تمامًا إجراء هندسة عكسية، أو نسخ، أو إعادة إنتاج، أو تقليد، أو توزيع هذه المنصة دون ترخيص. تحتفظ Cube Short بالحق في بدء الإجراءات القانونية والجنائية. © Cube Short. جميع الحقوق محفوظة.` },
                { title: `المادة 6: التنازل`, text: `يتنازل المستخدم بشكل لا رجعة فيه عن حقه في رفع دعاوى قضائية ضد Cube Short بسبب أي تسرب محتمل للبيانات أو أخطاء برمجية.` },
                { title: `المادة 7: تراخيص المصادر المفتوحة`, text: `تم تطوير Music Box باستخدام بنيات تحتية مفتوحة المصدر مجانية.` }
            ],
            footerText: `© 2026 Cube Short. جميع الحقوق محفوظة. <br> هذه الوثيقة تحت الحماية القانونية. الاستنساخ والنسخ غير المصرح به محظور.`

        az: {
            title: `İSTİFADƏ VƏ MƏXFİLİK ŞƏRTLƏRİ`,
            intro: `Bu Hərtərəfli Rəqəmsal Platforma İstifadә Müqavilәsi, İnteqrasiya edilmiş Xidmət Şərtləri, Genişləndirilmiş Məxfilik Siyasəti və Mütləq Məsuliyyətdən Azad Olma Müqaviləsi (“Müqavilə”) Cube Short markası (“Cube Short”) və bütün fiziki şəxslər (“İstifadəçi”) arasında qanuni olaraq tam məcburi və geri alınmaz bir müqavilə kimi tərtib edilmişdir.`,
            articles: [
                { title: `Maddə 1: Mütləq Məsuliyyətdən Azad Olma və Proqram Təminatının Təbiəti`, text: `Tətbiqdən istifadə tamamilə İstifadəçinin öz iradəsi və şəxsi riski altındadır. Heç bir rəqəmsal platforma qüsursuz deyil. Proqram çökmələri, məlumat itkiləri və ya hər hansı zərərlərə görə Cube Short məsuliyyət daşımır.` },
                { title: `Maddə 2: Kiber Təhlükəsizlik İhlalları və Məlumat Oğurluğu`, text: `Kiber məkanda mütləq (100%) təhlükəsizlik texniki cəhətdən qeyri-mümkündür. Kiber hücumlar, haker müdaxilələri və ya məlumat oğurluğu halında Cube Short heç bir təzminat öhdəliyi daşımır. Bütün məsuliyyət yalnız İstifadəçiyə aiddir.` },
                { title: `Maddə 3: Üçüncü Tərəf Reklam Şəbəkələri, Məzmun Nəzarətsizliyi və Qanuni İmtina`, text: `Platforma daxilində göstərilən, inteqrasiya edilən və ya üçüncü tərəf qlobal reklam şəbəkələri (məs. Google AdMob və s.) vasıtəsilə dinamik olaraq interfeysə yerləşdirilən reklam məzmunları tamamilə müvafiq reklam təminatçılarının alqoritmik serverlərindən avtomatik olaraq çəkilir və bu məzmunlar heç bir halda Cube Short tərəfindən əl ilə filtrasiya edilmir, təsdiqlənmir və ya əvvəlcədən yoxlanılmır. Tətbiq daxilindəki alqoritmik reklam paylanması prosesinə birbaşa müdaxilə səlahiyyəti olmayan Cube Short; istifadəçinin coğrafi mövqeyinə, axtarış tarixinə və ya cihaz profilinə bağlı olaraq təqdim edilə bilən və potensial olaraq ədəbsiz (+18), şiddət ehtiva edən, böyüklər üçün nəzərdə tutulan, zərərli və ya qanunsuz ünsürlər barındıra bilən heç bir vizual, səsli və ya mətnli reklam məzmununa görə (birbaşa və ya dolaylı) əsas və ya köməkçi icraçı qismində məsuliyyət daşımır. Xüsusilə platformaya daxil olan yetkinlik yaşına çatmayan şəxslərin və ya uşaqların öz istifadəçi profillərinə və ya şəbəkə keçmişinə əsaslanaraq təsadüfən qarşılarına çıxa biləcək bu cür zərərli məzmunlara (ədəbsiz reklamlar daxil olmaqla, lakin bunlarla məhdudlaşmayaraq) məruz qalma ehtimalına görə, müvafiq cihazın və internet bağlantısının mütləq nəzarəti müstəsna olaraq valideynin və ya qəyyumun qanuni məsuliyyəti altındadır. İstifadəçi və ya onun qanuni nümayəndəsi bu platformadan istifadə etməklə üçüncü tərəf reklam şəbəkələrindən qaynaqlana biləcək hər cür arzuolunmaz məzmuna məruz qalma riskini əvvəlcədən, geri alınmaz şəkildə qəbul edir və bu xüsusda Cube Short markasına, rəhbərlərinə, proqramçılarına və ya iştirakçılarına qarşı yönəldilə biləcək hər cür inzibati, cinayət, hüquqi və ya maddi təzminat tələbindən və reqres hüququndan tamamilə imtina etdiyini bəyan və təعهد edir.` },
                { title: `Maddə 4: Yaş Məhdudiyyəti və Valideyn Nəzarəti`, text: `Tətbiq 13 yaş və yuxarı şəxslər üçün nəzərdə tutulmuşdur. 13 yaşından kiçik istifadəçilərin hərəkətlərinə görə birbaşa onların valideynləri məsuliyyət daşıyır.` },
                { title: `Maddə 5: Əqli Mülkiyyət Hüquqları, Müəllif Hüququ (Copyright) və Kopyalama Qadağası`, text: `Bütün mənbə kodları, interfeys dizaynları, alqoritmlər, loqolar və əqli mülkiyyəti hüquqları müstəsna olaraq Cube Short-a aiddir. Bu platformanın tərs mühəndislik (reverse engineering) üsulları ilə mənbə koduna çevrilməsi, kopyalanması, təqlid edilməsi lisenziyasız qəti qadağandır. Cube Short hər cür hüquqi və cinayət təqibi başlatmaq hüququnu özündə saxlayır. © Cube Short. Bütün Hüquqlar Qorunur.` },
                { title: `Maddə 6: Hüquqlardan İmtina`, text: `İstifadəçi məlumat sızıntıları və ya proqram xətalarına görə Cube Short-a qarşı hər hansı məhkəmə iddiası qaldırmaq hüququndan geri alınmaz şəkildə imtina edir.` },
                { title: `Maddə 7: Açıq Mənbə Lisenziyaları`, text: `Music Box açıq mənbə kodlu (Open-Source) pulsuz infrastrukturdan istifadə edərək hazırlanmışdır. Tətbiqdə gizli qeyri-qanuni kod yoxdur.` }
            ],
            footerText: `© 2026 Cube Short. Bütün Hüquqlar Qorunur. <br> Bu sənəd hüquqi qorunma altındadır. İcazəsiz çoxaltdılması və kopyalanması qadağandır.`
        },
        ur: {
            title: `پرائیویسی پالیسی`,
            intro: `یہ جامع ڈیجیٹل پلیٹ فارم کے استعمال کا معاہدہ، مربوط سروس کی شرائط، توسیعی رازداری کی پالیسی، اور مطلق ذمہ داری سے استثنیٰ کا معاہدہ ("معاہدہ") Cube Short برانڈ ("Cube Short") اور تمام قدرتی افراد ("صارف") کے درمیان قانونی طور پر پابند اور ناقابل تنسیخ معاہدے کے طور پر قائم کیا گیا ہے۔`,
            articles: [

    function renderPolicy() {
        const lang = document.getElementById('langBox').value;
        const container = document.getElementById('policy-content');
        const footerContainer = document.getElementById('dynamic-footer');
        const data = policies[lang];

        container.innerHTML = '';
        container.style.animation = 'none';
        container.offsetHeight; 
        container.style.animation = 'fadeIn 0.6s ease-out';
        
        footerContainer.style.animation = 'none';
        footerContainer.offsetHeight; 
        footerContainer.style.animation = 'fadeIn 0.6s ease-out';
        
        if (lang === 'ar' || lang === 'ur') {
            container.setAttribute('dir', 'rtl');
            container.style.textAlign = 'right';
        } else {
            container.setAttribute('dir', 'ltr');
            container.style.textAlign = 'left';
        }

        const mainTitle = document.createElement('h2');
        mainTitle.textContent = data.title;
        mainTitle.style.color = 'var(--text-main)';
        mainTitle.style.textAlign = 'center';
        mainTitle.style.marginBottom = '25px';
        container.appendChild(mainTitle);

        const intro = document.createElement('div');
        intro.className = 'article-text';
        intro.innerHTML = `<strong>${data.intro}</strong>`;
        container.appendChild(intro);

        data.articles.forEach(article => {
            const artTitle = document.createElement('div');
            artTitle.className = 'article-title';
            artTitle.textContent = article.title;
            
            const artText = document.createElement('div');
            artText.className = 'article-text';
            artText.textContent = article.text;

            container.appendChild(artTitle);
            container.appendChild(artText);
        });

        footerContainer.innerHTML = data.footerText;
    }

    window.onload = () => {
        const langBox = document.getElementById('langBox');
        let userLang = (navigator.language || navigator.userLanguage).split('-')[0].toLowerCase();
        
        if (policies[userLang]) {
            langBox.value = userLang;
        } else {
            langBox.value = 'en'; 
        }

        renderPolicy();
    };
